# Deploys the replay build to GitHub Pages when a v1 or later tag is pushed.
# Earlier tags (v0.5) have no replay-shows.zip, so they do not deploy.
# Nothing happens until Marius creates a release with replay-shows.zip attached
# and enables Pages (source: GitHub Actions) in the repo settings.
name: Replay page

on:
  push:
    tags: ["v[1-9]*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download the published shows
        # replay-shows.zip is attached to the release of this tag by
        # `radio-llama export-replay ... --zip`. MP3s are never committed (D002),
        # so the release asset is what makes the build reproducible from the tag.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern replay-shows.zip --dir /tmp
          mkdir -p public/shows && unzip -o /tmp/replay-shows.zip -d public/shows
      - run: npm ci
      - run: npm run build:replay
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
