name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv python install
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python catalog/download.py
      - run: uv run radio-llama generate --fake --style jazz --persona calm --seed 1
      - run: test -f output/*/show.mp3
        shell: bash
      - name: OpenAPI schema is up to date
        run: |
          uv run radio-llama export-openapi frontend/openapi.json
          git diff --exit-code frontend/openapi.json
