name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv python install
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python catalog/download.py
      - run: uv run radio-llama generate --fake --style jazz --persona calm --seed 1
      - run: test -f output/*/show.mp3
        shell: bash
      - name: OpenAPI schema is up to date
        run: |
          uv run radio-llama export-openapi frontend/openapi.json
          git diff --exit-code frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate-types
      - name: API types are up to date
        run: git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run build

  docker:
    # Docker is not installed on the development machine, so the image is built here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t radio-llama .
